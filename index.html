<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#018792">
<title>Ideas que Suman · Club de Mejora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F5; --card:#FFFFFF; --card2:#F0F2F2; --line:#E1E4E4;
  --txt:#383D3D; --mut:#7A8080; --acc:#018792; --acc-d:#015F67; --acc-l:#E6F4F5; --acc2:#D00023; --ok:#1E9E6A; --bad:#D00023; --info:#2F7FC1;
  --sh:0 1px 3px rgba(56,61,61,.08),0 4px 14px rgba(56,61,61,.05);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--txt);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:110px}
h1,h2,h3,.cond{font-family:'Bebas Neue',system-ui,sans-serif;font-weight:400;letter-spacing:.03em}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-family:'Bebas Neue',system-ui,sans-serif;font-weight:400;font-size:20px}
.brand b{display:block;font-family:'Bebas Neue',system-ui,sans-serif;font-size:20px;line-height:1}
.brand small{color:var(--mut);font-size:12px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:18px}
.pillbal{background:var(--card);box-shadow:var(--sh);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.pillbal span{color:var(--acc)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#018792 0%,#015F67 100%);color:#fff;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.82)}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar i{background:#fff}
.hero .big{font-family:'Bebas Neue',system-ui,sans-serif;font-size:64px;font-weight:400;line-height:.9;color:#fff}
.hero .lbl{color:rgba(255,255,255,.82);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.lvl{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700}
.bar{height:10px;background:#E6EAEA;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .6s}
.muted{color:var(--mut)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh)}
.stat b{font-family:'Bebas Neue',system-ui,sans-serif;font-size:28px;display:block;line-height:1}
.stat span{font-size:12px;color:var(--mut)}
.sec{font-family:'Bebas Neue',system-ui,sans-serif;font-size:24px;letter-spacing:.03em;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec a{font-family:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;letter-spacing:0;font-size:13px;color:var(--acc);font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:35px;background:var(--acc);color:#fff;font-family:'Bebas Neue',system-ui,sans-serif;font-weight:400;letter-spacing:.06em;font-size:20px}
.btn.sec2{background:var(--card2);color:var(--txt)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:8px 14px;font-size:17px;width:auto;border-radius:35px}
.btn:disabled{opacity:.4}

.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.demo{background:#FFF6E0;color:#7A5A00}
.banner.chal{background:#FDE8EB;color:#8A0018}
.banner.ro{background:var(--acc-l);color:var(--acc-d)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--mut);font-weight:600;font-size:14px;border:1px solid var(--line)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-weight:600;font-size:14px}
.cat.on{border-color:var(--acc);background:var(--acc-l)}
.cat em{font-style:normal;font-size:22px;display:block;margin-bottom:4px}

/* idea card */
.idea{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
.idea h3{font-size:24px;line-height:1.1;margin:6px 0 4px}
.idea p{color:#4A5050;font-size:15px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.st.pendiente{background:#ECEEEE;color:#5D6363}
.st.aprobada{background:#E3EFFA;color:var(--info)}
.st.implementada{background:#E2F5EC;color:#1E7A52}
.st.descartada{background:#FDE8EB;color:var(--bad)}
.vote{display:flex;align-items:center;gap:6px;background:var(--card2);padding:8px 12px;border-radius:12px;font-weight:700}
.vote.on{background:#FDE8EB;color:var(--acc2)}
.vote:disabled{opacity:.5}
.note{margin-top:10px;background:var(--card2);border-left:3px solid var(--acc);padding:8px 10px;border-radius:8px;font-size:14px;color:#4A5050}
.ideafoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;color:var(--mut)}
.badge em{font-style:normal;font-size:26px;display:block;filter:grayscale(1);opacity:.35}
.badge.on{color:var(--txt)}
.badge.on em{filter:none;opacity:1}

/* rank */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:8px 0 14px}
.pod{background:var(--card);box-shadow:var(--sh);border-radius:16px 16px 8px 8px;padding:12px 6px;text-align:center}
.pod .av{width:48px;height:48px;margin:0 auto 6px;font-size:20px}
.pod b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .p{font-family:'Bebas Neue',system-ui,sans-serif;font-size:28px;color:var(--acc)}
.pod.n1{padding-top:20px;background:linear-gradient(var(--acc-l),var(--card))}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow .n{width:22px;color:var(--mut);font-weight:700;text-align:center}
.rrow .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .pp{font-family:'Bebas Neue',system-ui,sans-serif;font-size:22px}
.rrow.me{background:var(--acc-l);border-radius:12px}

/* rewards */
.rew{display:flex;align-items:center;gap:14px;background:var(--card);box-shadow:var(--sh);border-radius:var(--r);padding:14px;margin-bottom:10px}
.rew .em{width:54px;height:54px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:28px;flex:none}
.rew .t{flex:1;min-width:0}
.rew .t b{display:block;font-size:17px}
.cost{font-family:'Bebas Neue',system-ui,sans-serif;font-size:22px;letter-spacing:.03em;color:var(--acc)}

/* history */
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.hist .pl{font-weight:700;color:var(--ok);white-space:nowrap}
.hist .mn{font-weight:700;color:var(--bad);white-space:nowrap}

/* how */
.how{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.how:last-child{border:0}
.how b{color:var(--acc)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);font-weight:600;padding:4px 0}
.nav button i{font-style:normal;font-size:21px;line-height:1.1}
.nav button.on{color:var(--acc)}
.nav .fab{width:58px;height:58px;border-radius:18px;background:var(--acc);color:#fff;font-size:32px;font-weight:600;margin:-26px auto 0;box-shadow:0 8px 24px rgba(1,135,146,.35);display:grid;place-items:center}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,25,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s ease-out}
.sheet h2{font-size:30px;margin-bottom:6px}
.grab{width:40px;height:5px;background:var(--line);border-radius:9px;margin:-6px auto 14px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stbtns button{padding:12px;border-radius:12px;background:var(--card2);font-weight:700;border:2px solid transparent;font-size:14px}
.stbtns button.on{border-color:var(--acc)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* toast */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--acc);color:#fff;font-weight:700;padding:12px 18px;border-radius:14px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:pop .35s cubic-bezier(.3,1.6,.6,1);max-width:90vw;text-align:center}
.toast.err{background:var(--bad);color:#fff}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}

.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty em{font-style:normal;font-size:44px;display:block;margin-bottom:8px}
.center{min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.seg{display:flex;background:#E6EAEA;border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:var(--sh)}
.adm-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.adm-tabs::-webkit-scrollbar{display:none}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi .stat{text-align:left;padding:14px}
.kpi .stat b{font-size:32px}
.rewedit{display:grid;grid-template-columns:52px 1fr 80px 36px;gap:6px;margin-bottom:8px;align-items:center}
.rewedit input{padding:10px 8px}
.x{width:36px;height:36px;border-radius:10px;background:var(--card2);color:var(--bad);font-weight:700}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.mrow:last-child{border:0}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{display:block;color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.mrow .iconbtn{width:34px;height:34px;font-size:15px;flex:none}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--acc-l);color:var(--acc-d);margin-left:6px;vertical-align:middle}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--card2);padding:12px;border-radius:12px;font-size:14px}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--acc)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(() => {
/* ================== CONFIGURACIÓN POR DEFECTO ================== */
const CATS = [
  {id:'ingresos', em:'💰', name:'Nuevos servicios / ingresos'},
  {id:'entreno',  em:'🏋️', name:'Entrenamientos y clases'},
  {id:'instal',   em:'🛠️', name:'Instalaciones y material'},
  {id:'marketing',em:'📣', name:'Marketing y captación'},
  {id:'atencion', em:'🤝', name:'Atención al socio'},
  {id:'otro',     em:'✨', name:'Otra idea'}
];
const IMPACT = [
  {v:0, t:'No lo sé'}, {v:50, t:'Menos de 100 €/mes'}, {v:300, t:'100 – 500 €/mes'},
  {v:750, t:'500 – 1.000 €/mes'}, {v:1500, t:'Más de 1.000 €/mes'}
];
const DEFAULT_RULES = {submit:10, approve:50, implement:150, voteReceived:2, voteGiven:1};
const DEFAULT_REWARDS = [
  {id:'r1', em:'🥤', name:'Batido de proteínas', cost:100},
  {id:'r2', em:'👕', name:'Camiseta del centro', cost:250},
  {id:'r3', em:'💪', name:'Sesión 1:1 extra', cost:350},
  {id:'r4', em:'🏷️', name:'10% dto. en tu cuota', cost:500},
  {id:'r5', em:'🏆', name:'Un mes gratis', cost:1200}
];
const LEVELS = [
  {min:0,    name:'Bronce',  em:'🥉'},
  {min:150,  name:'Plata',   em:'🥈'},
  {min:400,  name:'Oro',     em:'🥇'},
  {min:800,  name:'Platino', em:'💎'},
  {min:1500, name:'Leyenda', em:'👑'}
];
const BADGES = [
  {id:'primera', em:'💡', name:'Primera idea', test:s=>s.ideas>=1},
  {id:'cinco',   em:'🔥', name:'5 ideas',      test:s=>s.ideas>=5},
  {id:'diez',    em:'🚀', name:'10 ideas',     test:s=>s.ideas>=10},
  {id:'aprob',   em:'✅', name:'Aprobada',     test:s=>s.approved>=1},
  {id:'impl',    em:'🛠️', name:'Hecha realidad',test:s=>s.implemented>=1},
  {id:'dinero',  em:'💰', name:'Genera ingresos',test:s=>s.moneyImpl>=1},
  {id:'popular', em:'⭐', name:'Popular (10 votos)',test:s=>s.maxVotes>=10},
  {id:'votante', em:'🗳️', name:'Votante (10)', test:s=>s.votesGiven>=10}
];
const STATUS_LBL = {pendiente:'Pendiente', aprobada:'Aprobada', implementada:'Implementada', descartada:'Descartada'};

/* ================== ESTADO ================== */
const S = {
  phase:'loading', mode:null, me:null, isAdmin:false, canWrite:true, demoRole:'socio',
  members:{}, suggestions:{}, reviews:{}, votes:{}, redemptions:{}, deliveries:{}, config:{}, blocked:{},
  view:'inicio', ideaFilter:'todas', ideaSort:'recientes', rankMode:'mes', admTab:'revisar',
  draft:{title:'', text:'', cat:'', impact:0}, modal:null, stale:false, loadNote:''
};
const COLLS = ['members','suggestions','reviews','votes','redemptions','deliveries','config','blocked'];

/* ================== UTILIDADES ================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const cat = id => CATS.find(c=>c.id===id) || CATS[5];
const initials = n => (String(n||'?').replace(/[^\p{L}\d\s]/gu,'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2) || '?').toUpperCase();
const fmtDate = t => { if(!t) return ''; const d=new Date(t), now=Date.now(), diff=(now-t)/864e5;
  if(diff<1 && new Date(now).getDate()===d.getDate()) return 'hoy';
  if(diff<2) return 'ayer'; if(diff<7) return `hace ${Math.floor(diff)} días`;
  return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); };
const eur = n => (n||0).toLocaleString('es-ES') + ' €';
const rules = () => ({...DEFAULT_RULES, ...(S.config.main?.rules||{})});
const rewards = () => (S.config.main?.rewards && S.config.main.rewards.length) ? S.config.main.rewards : DEFAULT_REWARDS;
const centerName = () => S.config.main?.centerName || 'Silban360';
const challenge = () => S.config.main?.challenge || null; // {cat, mult}
const alias = id => S.members[id]?.alias || 'Antiguo socio';
const isAdmin = () => S.mode==='demo' ? S.demoRole==='admin' : S.isAdmin;

function toast(msg, err){ const t=$('#toast'); t.innerHTML=`<div class="toast ${err?'err':''}">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML='',2600); }

/* ================== ALMACENAMIENTO ==================
   Modo "live": base de datos compartida del artefacto (todos ven lo mismo).
   Modo "demo": datos guardados solo en este navegador, para probar.        */
let store = null;

function makeDbStore(db){
  return {
    watch(coll, cb, onErr){ return db.collection(coll).onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); }); cb(m, snap.metadata); }, onErr); },
    set:(coll,id,data)=>db.collection(coll).doc(id).set(data),
    del:(coll,id)=>db.collection(coll).doc(id).delete()
  };
}
function makeDemoStore(){
  const KEY='ideas_que_suman_demo_v2'; let data=null; const subs={};
  try{ data=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!data){ data=demoSeed(); }
  const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} };
  const emit=c=>(subs[c]||[]).forEach(cb=>cb({...data[c]},{fromCache:false}));
  save();
  return {
    watch(c,cb){ data[c]=data[c]||{}; (subs[c]=subs[c]||[]).push(cb); setTimeout(()=>cb({...data[c]},{fromCache:false}),0); return ()=>{}; },
    async set(c,id,v){ data[c]=data[c]||{}; data[c][id]=JSON.parse(JSON.stringify(v)); save(); emit(c); },
    async del(c,id){ if(data[c]) delete data[c][id]; save(); emit(c); },
    reset(){ data=demoSeed(); save(); COLLS.forEach(emit); }
  };
}
function demoSeed(){
  const d=864e5, n=Date.now();
  const members={ 'demo-yo':{alias:'Tú (demo)',joinedAt:n-20*d,self:true}, m1:{alias:'Laura G.',email:'laura@ejemplo.com',phone:'600 111 222',joinedAt:n-60*d,addedByAdmin:true}, m2:{alias:'Carlos M.',email:'carlos@ejemplo.com',joinedAt:n-50*d,addedByAdmin:true}, m3:{alias:'Marta R.',phone:'611 333 444',joinedAt:n-40*d,addedByAdmin:true}, m4:{alias:'Javi P.',joinedAt:n-30*d,self:true} };
  const suggestions={
    s1:{authorId:'m1',title:'Bonos de 5 sesiones para parejas',text:'Muchos venimos en pareja. Un bono compartido con algo de descuento animaría a traer a la pareja y entraría más dinero.',cat:'ingresos',impact:750,createdAt:n-12*d},
    s2:{authorId:'m2',title:'Clase de movilidad los sábados',text:'Una clase corta de movilidad el sábado por la mañana. Mucha gente la pagaría aparte.',cat:'entreno',impact:300,createdAt:n-9*d},
    s3:{authorId:'m3',title:'Programa "Trae a un amigo"',text:'Si un socio trae a alguien que se apunta, los dos ganan una semana gratis.',cat:'marketing',impact:1500,createdAt:n-6*d},

/* ================== PUNTOS ================== */
function compute(){
  const R=rules(), ev={}, st={};
  const push=(u,pts,at,label)=>{ if(!u) return; (ev[u]=ev[u]||[]).push({pts,at:at||0,label}); };
  const S0=()=>({ideas:0,approved:0,implemented:0,moneyImpl:0,maxVotes:0,votesGiven:0});
  const stat=u=>st[u]=st[u]||S0();
  const vBy={}; Object.values(S.votes).forEach(v=>{ (vBy[v.sid]=vBy[v.sid]||[]).push(v); });
  for(const [sid,s] of Object.entries(S.suggestions)){
    const rv=S.reviews[sid]||{}, status=rv.status||'pendiente';
    if(status==='descartada') continue;
    const a=s.authorId, x=stat(a), m=rv.mult||1;
    x.ideas++;
    push(a,R.submit,s.createdAt,`Idea enviada · ${s.title}`);
    if(status==='aprobada'||status==='implementada'){ x.approved++; push(a,Math.round(R.approve*m),rv.at,`Idea aprobada${m>1?' (x'+m+')':''} · ${s.title}`); }
    if(status==='implementada'){ x.implemented++; if(s.cat==='ingresos') x.moneyImpl++; push(a,Math.round(R.implement*m),rv.implAt||rv.at,`Idea implementada · ${s.title}`); }
    if(rv.bonus) push(a,+rv.bonus,rv.implAt||rv.at,`Bonus por impacto · ${s.title}`);
    const vs=(vBy[sid]||[]).filter(v=>v.uid!==a);
    x.maxVotes=Math.max(x.maxVotes,vs.length);
    vs.forEach(v=>push(a,R.voteReceived,v.at,`Voto recibido · ${s.title}`));
  }
  Object.values(S.votes).forEach(v=>{ const s=S.suggestions[v.sid]; if(!s||s.authorId===v.uid) return; if((S.reviews[v.sid]?.status)==='descartada') return; stat(v.uid).votesGiven++; push(v.uid,R.voteGiven,v.at,`Has votado · ${s.title}`); });
  Object.entries(S.redemptions).forEach(([rid,r])=>{ if(S.deliveries[rid]?.status==='rechazado') return; push(r.uid,-r.cost,r.at,`Canje · ${r.name}`); });
  const mStart=new Date(); mStart.setDate(1); mStart.setHours(0,0,0,0);
  const out={};
  const ids=new Set([...Object.keys(S.members),...Object.keys(ev)]);
  ids.forEach(u=>{ const e=(ev[u]||[]).sort((a,b)=>b.at-a.at);
    const earned=e.filter(x=>x.pts>0).reduce((t,x)=>t+x.pts,0);
    const month=e.filter(x=>x.pts>0&&x.at>=mStart.getTime()).reduce((t,x)=>t+x.pts,0);
    const balance=e.reduce((t,x)=>t+x.pts,0);
    out[u]={events:e,earned,month,balance,stats:st[u]||S0()}; });
  return out;
}
function levelOf(p){ let i=0; LEVELS.forEach((l,k)=>{ if(p>=l.min) i=k; }); const cur=LEVELS[i], nx=LEVELS[i+1]; return {cur,nx,pct:nx?Math.min(100,Math.round((p-cur.min)/(nx.min-cur.min)*100)):100}; }

function render(){
  S.stale=false;
  const root=$('#root');
  if(S.phase==='loading'){ root.innerHTML=`<div class="app center"><div class="spin"></div><p class="muted" style="text-align:center">Cargando…${S.loadNote?'<br><small>'+esc(S.loadNote)+'</small>':''}</p></div>`; return; }
  if(S.phase==='onboard'){ root.innerHTML=onboard(); bindOnboard(); return; }
  if(S.phase==='blocked'){ root.innerHTML=`<div class="app center" style="text-align:center"><div style="font-size:56px">🔒</div><h1 style="font-size:36px;margin:10px 0">Acceso retirado</h1><p class="muted">Tu acceso a ${esc(centerName())} · Ideas que suman ha sido retirado. Si crees que es un error, habla con el equipo del centro.</p></div>`; return; }
  const P=compute(), me=P[S.me]||{events:[],earned:0,month:0,balance:0,stats:{}};
  let body='';
  if(S.view==='inicio') body=vInicio(P,me);

  root.innerHTML=`<div class="app">${header(me)}${banners()}${body}</div>${nav()}`;
  bind();
}

function openModal(m){ S.modal=m; renderModal(); }
function closeModal(){ S.modal=null; $('#modal').innerHTML=''; if(S.stale) render(); }

    <div class="card" style="background:var(--card2);margin-top:10px"><b>${esc(s.title)}</b><p class="small" style="margin-top:4px;white-space:pre-wrap">${esc(s.text)}</p></div>
    <div class="field"><label>Estado</label><div class="stbtns">${b('pendiente','⏳ Pendiente')}${b('aprobada','✅ Aprobar')}${b('implementada','🛠️ Implantada')}${b('descartada','🚫 Descartar')}</div></div>
    <div class="field"><label>Bonus extra de puntos (si genera ingresos o tiene mucho impacto)</label><input id="m-bonus" type="number" min="0" value="${esc(rv.bonus||'')}" placeholder="0"></div>
    <div class="field"><label>Ingreso real estimado para el centro (€/mes, opcional)</label><input id="m-value" type="number" min="0" value="${esc(rv.value??'')}" placeholder="Si lo sabes, mejora el resumen"></div>
    <div class="field"><label>Mensaje para el socio (lo verá todo el mundo)</label><textarea id="m-note" style="min-height:80px" placeholder="¡Gracias! La ponemos en marcha en enero.">${esc(rv.note||'')}</textarea></div>
    <div class="row"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn" data-act="msave">Guardar</button></div>

  }

    const r=rewards().find(x=>x.id===m.id);

    <p class="muted" style="text-align:center;margin-bottom:16px">Se descontarán <b style="color:var(--acc)">${r.cost} pts</b>. Recógelo en recepción: el centro lo marcará como entregado.</p>
    <div class="row"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn" data-act="mredeem">Confirmar canje</button></div>`;
  }
  if(m.type==='perfil'){
    const me=compute()[S.me]||{events:[]};
    h=`<h2>Mi perfil</h2>
    <div class="field"><label>Cómo apareces en el ranking</label><input id="m-alias" maxlength="30" value="${esc(alias(S.me))}"></div>
    <button class="btn" data-act="msavealias" ${S.canWrite?'':'disabled'}>Guardar nombre</button>
    <div class="sec">Historial de puntos</div>
    <div class="card" style="background:var(--card2)">${me.events.length?me.events.map(histRow).join(''):'<div class="muted small">Sin movimientos todavía.</div>'}</div>
    <button class="btn ghost" data-act="mclose">Cerrar</button>`;
  }
  if(m.type==='member'){
    const x=m.id?S.members[m.id]:{};
    h=`<h2>${m.id?'Editar persona':'Añadir persona'}</h2>
    <p class="muted small">${m.id?'Cambia sus datos. Sus puntos e ideas se mantienen.':'Dale de alta para que aparezca en el ranking. Guarda su email: servirá para que inicie sesión cuando la app tenga acceso con cuenta.'}</p>
    <div class="field"><label>Nombre *</label><input id="mm-name" maxlength="30" value="${esc(x.alias||'')}" placeholder="Ej.: Laura García"></div>
    <div class="field"><label>Email</label><input id="mm-email" type="email" maxlength="80" value="${esc(x.email||'')}" placeholder="laura@email.com"></div>
    <div class="field"><label>Teléfono</label><input id="mm-phone" type="tel" maxlength="20" value="${esc(x.phone||'')}" placeholder="600 000 000"></div>
    <div class="row"><button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn" data-act="msavemember">${m.id?'Guardar':'Añadir'}</button></div>`;
  }
  if(m.type==='rmmember'){
    const x=S.members[m.id]||{}, st=(compute()[m.id]||{}).stats||{};
    h=`<h2>Quitar a ${esc(x.alias||'esta persona')}</h2>
    <p class="muted" style="margin-bottom:12px">Dejará de aparecer en la app y en el ranking${x.self?' y no podrá volver a entrar':''}.</p>
    <label class="chk"><input type="checkbox" id="rm-data"><span>Borrar también sus <b>${st.ideas||0} ideas</b>, sus votos y sus canjes. Si no lo marcas, sus ideas se quedan como “Antiguo socio”.</span></label>

    <div class="stbtns"><button class="${S.demoRole==='socio'?'on':''}" data-role="socio">🏃 Socio</button><button class="${S.demoRole==='admin'?'on':''}" data-role="admin">⚙️ Administrador</button></div>`;

  el.innerHTML=`<div class="ov" data-ov="1"><div class="sheet"><div class="grab"></div>${h}</div></div>`;
  bindModal();
}

/* ================== ACCIONES ================== */
function writeFail(e){
  if(e&&e.code==='invalid_argument'){ S.canWrite=false; toast('No tienes permiso para guardar cambios aquí',1); render(); }
  else if(e&&e.code==='quota_exceeded') toast('Se ha llenado la base de datos. Borra ideas antiguas.',1);
  else toast('No se pudo guardar. Inténtalo de nuevo.',1);
}
function go(v){ S.view=v; if(v!=='admin') S.admRewardsDraft=null; render(); window.scrollTo(0,0); }

function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go);});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.ideaFilter=b.dataset.filter;render();});
  document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{S.ideaSort=b.dataset.sort;render();});
  document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{S.rankMode=b.dataset.rank;render();});
  document.querySelectorAll('[data-adm]').forEach(b=>b.onclick=()=>{S.admTab=b.dataset.adm;S.admRewardsDraft=null;render();});
  document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openModal({type:'review',id:b.dataset.review}));
  document.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>openModal({type:'redeem',id:b.dataset.redeem}));
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>toggleVote(b.dataset.vote));
  document.querySelectorAll('[data-deliv]').forEach(b=>b.onclick=()=>deliver(b.dataset.deliv,b.dataset.s));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ saveDraftInputs(); S.draft.cat=b.dataset.cat; render(); });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.preventDefault();act(b.dataset.act);});
  document.querySelectorAll('[data-editm]').forEach(b=>b.onclick=()=>openModal({type:'member',id:b.dataset.editm}));
  document.querySelectorAll('[data-rmm]').forEach(b=>b.onclick=()=>openModal({type:'rmmember',id:b.dataset.rmm}));
  const q=$('#ms-q'); if(q){ q.value=S.memberQuery||''; const f=()=>{ S.memberQuery=q.value; const v=q.value.trim().toLowerCase(); document.querySelectorAll('#ms-list [data-q]').forEach(r=>r.style.display=!v||r.dataset.q.includes(v)?'':'none'); }; q.oninput=f; q.onblur=()=>{ if(S.stale && !S.modal) render(); }; f(); }
  // borradores
  ['f-title','f-text','f-impact'].forEach(id=>{ const el=$('#'+id); if(el) el.oninput=saveDraftInputs; });
  document.querySelectorAll('[data-rw]').forEach(el=>el.oninput=()=>{ const r=S.admRewardsDraft[+el.dataset.rw]; r[el.dataset.k]=el.dataset.k==='cost'?+el.value:el.value; });
  document.querySelectorAll('[data-rwdel]').forEach(b=>b.onclick=()=>{ S.admRewardsDraft.splice(+b.dataset.rwdel,1); render(); });
}
function saveDraftInputs(){ const t=$('#f-title'),x=$('#f-text'),i=$('#f-impact'); if(t) S.draft.title=t.value; if(x) S.draft.text=x.value; if(i) S.draft.impact=+i.value; }

async function act(a){
  if(a==='perfil') return openModal({type:'perfil'});
  if(a==='addmember') return openModal({type:'member'});
  if(a==='hist') return openModal({type:'perfil'});
  if(a==='role') return openModal({type:'role'});
  if(a==='enviar'){
    saveDraftInputs(); const d=S.draft;
    if(d.title.trim().length<4) return toast('Ponle un título (mín. 4 letras)',1);
    if(d.text.trim().length<10) return toast('Explica un poco más la idea',1);
    if(!d.cat) return toast('Elige una categoría',1);
    const id=uid();
    try{ await store.set('suggestions',id,{authorId:S.me,title:d.title.trim(),text:d.text.trim(),cat:d.cat,impact:+d.impact||0,createdAt:Date.now()});
      S.draft={title:'',text:'',cat:'',impact:0}; S.ideaFilter='mias'; go('ideas'); toast(`¡Idea enviada! +${rules().submit} pts ⚡`); }catch(e){ writeFail(e); }
  }
  if(a==='rwadd'){ S.admRewardsDraft.push({id:'r'+uid(),em:'🎁',name:'',cost:100}); render(); }
  if(a==='rwsave'){
    const list=S.admRewardsDraft.filter(r=>String(r.name).trim()&&+r.cost>0).map(r=>({id:r.id||('r'+uid()),em:String(r.em||'🎁').slice(0,4),name:String(r.name).trim().slice(0,60),cost:Math.round(+r.cost)}));
    if(!list.length) return toast('Añade al menos un premio',1);
    await saveConfig({rewards:list}); S.admRewardsDraft=null; render(); toast('Premios guardados ✅');
  }
  if(a==='cfgsave'){
    const r={}; Object.keys(DEFAULT_RULES).forEach(k=>{ const v=$('#rl-'+k); r[k]=Math.max(0,Math.round(+v.value||0)); });
    const c=$('#ch-cat').value; const ch=c?{cat:c,mult:+$('#ch-mult').value}:null;
    await saveConfig({rules:r,challenge:ch,centerName:$('#cfg-name').value.trim().slice(0,40)}); render(); toast('Ajustes guardados ✅');
  }
  if(a==='demoreset'){ store.reset(); toast('Datos de ejemplo restablecidos'); }
}
async function saveConfig(patch){
  const cur=JSON.parse(JSON.stringify(S.config.main||{}));
  try{ await store.set('config','main',{...cur,...patch,updatedAt:Date.now()}); }catch(e){ writeFail(e); }
}
let voting=false;
async function toggleVote(sid){
  if(voting) return; voting=true;
  const key=sid+'__'+S.me;
  try{ if(S.votes[key]) await store.del('votes',key); else { await store.set('votes',key,{sid,uid:S.me,at:Date.now()}); toast(`¡Voto! +${rules().voteGiven} pt 🔥`); } }
  catch(e){ writeFail(e); } finally{ voting=false; }
}
async function deliver(id,status){ try{ await store.set('deliveries',id,{status,at:Date.now()}); toast(status==='entregado'?'Marcado como entregado 📦':'Canje rechazado; puntos devueltos'); }catch(e){ writeFail(e); } }

function bindModal(){
  const m=S.modal;
  $('#modal [data-ov]').onclick=e=>{ if(e.target.dataset.ov) closeModal(); };
  document.querySelectorAll('#modal [data-act]').forEach(b=>b.onclick=async e=>{ e.preventDefault(); const a=b.dataset.act;
    if(a==='mclose') return closeModal();
    if(a==='msave'){
      const prev=S.reviews[m.id]||{}, now=Date.now(), ch=challenge(), s=S.suggestions[m.id];
      const bonus=Math.max(0,Math.round(+$('#m-bonus').value||0)), note=$('#m-note').value.trim().slice(0,400);
      const vRaw=$('#m-value').value; const value=vRaw===''?null:Math.max(0,+vRaw);
      const mult=prev.mult||((ch&&ch.cat===s.cat&&m.status!=='pendiente')?ch.mult:1);
      const rv={status:m.status,note,bonus,value,mult,
        at:(m.status==='aprobada'||m.status==='implementada')?(prev.at&&(prev.status==='aprobada'||prev.status==='implementada')?prev.at:now):now,
        implAt:m.status==='implementada'?(prev.implAt||now):null};
      b.disabled=true;
      try{ await store.set('reviews',m.id,rv); closeModal(); toast('Revisión guardada ✅'); }catch(err){ b.disabled=false; writeFail(err); }
    }
    if(a==='mdelete'){
      if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Pulsa otra vez para eliminar definitivamente'; return; }
      try{ await store.del('suggestions',m.id); await store.del('reviews',m.id).catch(()=>{}); closeModal(); toast('Idea eliminada'); }catch(err){ writeFail(err); }
    }
    if(a==='mredeem'){
      const r=rewards().find(x=>x.id===m.id), bal=(compute()[S.me]||{}).balance||0;
      if(bal<r.cost){ closeModal(); return toast('No tienes puntos suficientes',1); }
      b.disabled=true;
      try{ await store.set('redemptions',uid(),{uid:S.me,rewardId:r.id,name:r.name,em:r.em||'🎁',cost:r.cost,at:Date.now()}); closeModal(); toast(`¡Canjeado! Recoge tu ${r.name} en recepción 🎁`); }catch(err){ b.disabled=false; writeFail(err); }
    }
    if(a==='msavemember'){
      const name=$('#mm-name').value.trim(), email=$('#mm-email').value.trim().toLowerCase(), phone=$('#mm-phone').value.trim();
      if(name.length<2) return toast('Escribe el nombre (mín. 2 letras)',1);
      if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('El email no parece válido',1);
      if(email && Object.entries(S.members).some(([k,v])=>k!==m.id&&v.email===email)) return toast('Ya hay alguien con ese email',1);
      const id=m.id||('p-'+uid()), prev=S.members[id]||{joinedAt:Date.now(),addedByAdmin:true};
      b.disabled=true;
      try{ await store.set('members',id,{...prev,alias:name.slice(0,30),email,phone:phone.slice(0,20)}); closeModal(); toast(m.id?'Datos actualizados':'¡'+name+' añadido/a! 👋'); }catch(err){ b.disabled=false; writeFail(err); }
    }
    if(a==='mremove'){
      const id=m.id, x=S.members[id]||{}, wipe=$('#rm-data').checked;
      b.disabled=true;
      try{
        if(x.self) await store.set('blocked',id,{at:Date.now(),alias:x.alias||''});
        await store.del('members',id);
        if(wipe){
          for(const [sid,s] of Object.entries(S.suggestions)) if(s.authorId===id){ await store.del('suggestions',sid); await store.del('reviews',sid).catch(()=>{}); for(const k of Object.keys(S.votes)) if(S.votes[k].sid===sid) await store.del('votes',k).catch(()=>{}); }
          for(const k of Object.keys(S.votes)) if(S.votes[k]?.uid===id) await store.del('votes',k).catch(()=>{});
          for(const [rid,r] of Object.entries(S.redemptions)) if(r.uid===id){ await store.del('redemptions',rid); await store.del('deliveries',rid).catch(()=>{}); }
        }
        closeModal(); toast((x.alias||'Persona')+' quitado/a de la app');
      }catch(err){ b.disabled=false; writeFail(err); }
    }
    if(a==='msavealias'){ const v=$('#m-alias').value.trim(); if(v.length<2) return toast('Mínimo 2 letras',1);
      try{ await store.set('members',S.me,{...(S.members[S.me]||{joinedAt:Date.now()}),alias:v.slice(0,30)}); closeModal(); toast('Nombre actualizado'); }catch(err){ writeFail(err); } }
  });
  document.querySelectorAll('#modal [data-mst]').forEach(b=>b.onclick=()=>{ const keep={bonus:$('#m-bonus').value,value:$('#m-value').value,note:$('#m-note').value}; m.status=b.dataset.mst; renderModal(); $('#m-bonus').value=keep.bonus; $('#m-value').value=keep.value; $('#m-note').value=keep.note; });
  document.querySelectorAll('#modal [data-role]').forEach(b=>b.onclick=()=>{ S.demoRole=b.dataset.role; if(S.demoRole!=='admin'&&S.view==='admin') S.view='inicio'; closeModal(); render(); toast(S.demoRole==='admin'?'Ahora ves el panel ⚙️ arriba a la derecha':'Viendo como socio'); });
}

/* ================== ARRANQUE ================== */
function startWatching(){
  let pending=new Set(COLLS);
  const timer=setTimeout(()=>{ if(S.phase==='loading'){ S.loadNote='Los datos tardan en llegar. Comprueba tu conexión.'; render(); } },10000);
  COLLS.forEach(c=>store.watch(c,(m)=>{
    S[c==='config'?'config':c]=m;
    if(pending.has(c)){ pending.delete(c); if(!pending.size){ clearTimeout(timer); S.phase=S.blocked[S.me]?'blocked':(S.members[S.me]?'ready':'onboard'); render(); return; } }
    if(!pending.size && S.blocked[S.me] && S.phase!=='blocked'){ S.phase='blocked'; closeModal(); render(); return; }
    if(S.phase==='onboard' && S.members[S.me]) { S.phase='ready'; }
    if(!pending.size && S.phase!=='onboard') scheduleRender();
  },err=>{ clearTimeout(timer); if(S.phase==='loading'){ S.loadNote='No se pudo conectar con los datos.'; render(); } }));
}

async function init(){
  render();
  let db=null, user=null;
  if(window.claude && typeof window.claude.use==='function'){
    try{ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); }catch(e){}
  }
  let id=null;
  if(db&&user){ try{ id=await user.id(); }catch(e){} }
  if(db&&user&&id){
    S.mode='live'; S.me=id; store=makeDbStore(db);
    try{ S.isAdmin=!!(await user.canEdit()); }catch(e){}
    try{ const w=await user.can('data.write'); if(w===false) S.canWrite=false; }catch(e){}
  } else {
    S.mode='demo'; S.me='demo-yo'; store=makeDemoStore();
  }
  startWatching();
}
init();
})();
</script>
